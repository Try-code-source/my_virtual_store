<script>
        const TRACKING_URL = 'https://script.google.com/macros/s/AKfycbzDjpCzNVOBag47uzFnb8AH_rYQ-Vkz3J7xQY_5L3HkfyMqyoLVo4D_V3Bd3HBcVgqoow/exec';

        let cart = [];
        let total = 0;
        let startTime = Date.now();

        // --- GESTIONE USER ID DINAMICO DALL'URL ---
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            let val = urlParams.get(param);
            if (!val && window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                val = hashParams.get(param);
            }
            return val;
        }

        // Cerca l'ID tra le possibili chiavi nell'URL
        let urlUserId = getQueryParam('user_id') || getQueryParam('uid') || getQueryParam('userId') || getQueryParam('id');

        let userId;
        if (urlUserId) {
            userId = urlUserId;
            localStorage.setItem('store_user_id', userId);
        } else if (localStorage.getItem('store_user_id')) {
            userId = localStorage.getItem('store_user_id');
        } else {
            userId = 'USR-' + Math.random().toString(36).substring(2, 9);
        }

        console.log("ID Utente utilizzato per il tracciamento:", userId);

        // Nomi esatti dei file verificati dal repository GitHub
        const galleryImages = [
            { src: 'smartwatch.jpg', caption: 'Smartwatch Sport - Vista Principale' },
            { src: 'smartwatch_2.jpg', caption: 'Smartwatch Sport - Immagine 2' },
            { src: 'smartwatch_3.jpg', caption: 'Smartwatch Sport - Immagine 3' }
        ];
        let currentImgIndex = 0;

        function sendTracking(eventName, productName = '', productPrice = '') {
            let sessionDuration = Math.round((Date.now() - startTime) / 1000) + 's';

            fetch(TRACKING_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: userId,
                    user_id: userId, // Inviato con entrambe le notazioni per compatibilità
                    event: eventName,
                    productName: productName,
                    expenditure: productPrice,
                    sessionDuration: sessionDuration
                })
            }).catch(err => console.error('Errore tracking:', err));
        }

        window.addEventListener('DOMContentLoaded', () => {
            sendTracking('PageView');
        });

        window.addEventListener('beforeunload', () => {
            sendTracking('PageLeave');
        });

        function addToCart(productName, price) {
            cart.push({ name: productName, price: price });
            total += price;

            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total').innerText = total.toFixed(2);

            sendTracking('AddToCart', productName, price);
            alert(`"${productName}" è stato aggiunto al carrello!`);
        }

        /* --- LOGICA GALLERIA --- */
        function openGallery() {
            currentImgIndex = 0;
            updateModalImage();
            const modal = document.getElementById('galleryModal');
            modal.style.display = 'flex';
            sendTracking('ViewSimilarProducts', 'Smartwatch Sport');
        }

        function closeGallery() {
            document.getElementById('galleryModal').style.display = 'none';
        }

        function changeImage(direction) {
            currentImgIndex += direction;
            if (currentImgIndex < 0) {
                currentImgIndex = galleryImages.length - 1;
            } else if (currentImgIndex >= galleryImages.length) {
                currentImgIndex = 0;
            }
            updateModalImage();
        }

        function updateModalImage() {
            const imgElement = document.getElementById('modalImg');
            const captionElement = document.getElementById('modalCaption');
            
            imgElement.src = galleryImages[currentImgIndex].src;
            captionElement.innerText = galleryImages[currentImgIndex].caption;
        }

        // Chiudi cliccando fuori dall'immagine
        document.getElementById('galleryModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeGallery();
            }
        });
    </script>
